[[pipelines]]
name = "build-erdfa-wasm"
description = "Build eRDFa WASM module from namespace submodule"

[[pipelines.steps]]
name = "update-submodule"
commands = [
  "git submodule update --init --recursive submodules/namespace"
]

[[pipelines.steps]]
name = "build-wasm"
commands = [
  "cd submodules/namespace/wasm",
  "nix develop -c cargo build --target wasm32-unknown-unknown --release",
  "nix develop -c wasm-bindgen --target web --out-dir pkg target/wasm32-unknown-unknown/release/erdfa_wasm.wasm"
]

[[pipelines.steps]]
name = "copy-to-deploy"
commands = [
  "mkdir -p data/proofs/deploy/wasm",
  "cp submodules/namespace/wasm/pkg/* data/proofs/deploy/wasm/"
]

[[pipelines]]
name = "deploy-dashboard"
description = "Deploy dashboard with eRDFa WASM to HuggingFace"

[[pipelines.steps]]
name = "build-wasm"
trigger = { pipeline = "build-erdfa-wasm" }

[[pipelines.steps]]
name = "deploy-to-hf"
commands = [
  "cd data/proofs/deploy",
  "git add .",
  "git commit -m 'Update dashboard with eRDFa WASM'",
  "source ~/.agentrc && git push space main"
]

[[pipelines]]
name = "full-build"
description = "Build all Rust binaries and WASM modules"

[[pipelines.steps]]
name = "build-layer5"
commands = [
  "cd layer5_analysis",
  "nix develop -c cargo build --release --all-bins"
]

[[pipelines.steps]]
name = "build-erdfa-wasm"
trigger = { pipeline = "build-erdfa-wasm" }

[[pipelines.steps]]
name = "link-deps"
commands = [
  "mkdir -p target/deps",
  "ln -sf ../layer5_analysis/target/release/* target/deps/",
  "ln -sf ../submodules/namespace/wasm/pkg target/deps/erdfa-wasm"
]
